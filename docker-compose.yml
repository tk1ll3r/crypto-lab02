version: "3.8"

services:
  aes-test-all:
    build:
      context: .
      dockerfile: Dockerfile
    image: uit-nt219-aes-modes:latest
    container_name: uit_nt219_aes_test_all
    command: >
      sh -c "ctest --test-dir build-gcc-attn --output-on-failure &&
             ./build-gcc-attn/test_sp800_38a_38c &&
             ./build-gcc-attn/test_openssl_crosscheck &&
             ./build-gcc-attn/test_c &&
             python3 tests/test_import.py"

  aes-cli-demo:
    image: uit-nt219-aes-modes:latest
    container_name: uit_nt219_aes_cli_demo
    depends_on:
      - aes-test-all
    command: >
      sh -c "./build-gcc-attn/main --trace &&
             ./build-gcc-attn/main --mode cbc --action encrypt --key 2b7e151628aed2a6abf7158809cf4f3c --iv 000102030405060708090a0b0c0d0e0f --input 'Hello UIT NT219 Docker Container!' --verbose &&
             ./build-gcc-attn/main --mode ccm --action encrypt --key 404142434445464748494a4b4c4d4e4f --iv 101112131415161718191a1b1c --aad 0001020304050607 --input 'Authenticated CCM in Docker!' --verbose"
